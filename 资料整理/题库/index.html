<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物理刷题工作台</title>
<style>
:root{--ink:#172033;--muted:#667085;--line:#e7eaf0;--brand:#6557e8;--soft:#f5f4ff;--bg:#f7f8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 Inter,system-ui,"Microsoft Yahei",sans-serif}.app{max-width:1180px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.eyebrow{color:var(--brand);font-weight:700;letter-spacing:.08em;font-size:12px}.top h1{margin:4px 0;font-size:30px}.top p{margin:0;color:var(--muted)}.layout{display:grid;grid-template-columns:270px 1fr;gap:20px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px #26345d0b}.panel{padding:18px;height:max-content}.panel h3{margin:0 0 14px}.field{margin:14px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field select,.field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.tree{max-height:310px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px}.tree button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;color:var(--ink);cursor:pointer}.tree button.active,.tree button:hover{background:var(--soft);color:var(--brand)}.main{min-width:0}.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.badge{background:var(--soft);color:var(--brand);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700}.count{color:var(--muted)}.card{padding:30px;min-height:530px}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}.meta span{background:#f7f8fa;border-radius:7px;padding:3px 8px}.question{font-size:22px;line-height:1.8;margin:28px 0 22px;white-space:pre-wrap}.source{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{border:1px solid var(--line);background:#fff;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.explain{margin-top:22px;background:#fbfbff;border:1px solid #e4e1ff;border-radius:12px;padding:16px;display:none}.explain h3{margin:0 0 8px;color:var(--brand)}.progress{height:6px;background:#eceef5;border-radius:99px;overflow:hidden;margin:16px 0}.progress i{display:block;height:100%;background:var(--brand);transition:.2s}.empty{padding:60px;text-align:center;color:var(--muted)}@media(max-width:800px){.layout{grid-template-columns:1fr}.top{display:block}.panel{position:static}.question{font-size:19px}.card{padding:22px}}
</style></head><body><div class="app"><header class="top"><div><div class="eyebrow">PHYSICS PREP · ADAPTIVE PRACTICE</div><h1>物理刷题工作台</h1><p>一次只专注一道题，按知识树与题型组织练习。</p></div><div class="badge" id="mode">智能推荐</div></header><div class="layout"><aside class="panel"><h3>练习筛选</h3><div class="field"><label>考试科目</label><select id="exam"><option value="651">651 普通物理</option><option value="803">803 量子力学</option></select></div><div class="field"><label>题型</label><select id="type"><option value="">全部题型</option></select></div><div class="field"><label>知识树</label><div class="tree" id="tree"></div></div><button class="btn primary" id="recommend" style="width:100%">重新推荐</button><details style="margin-top:16px"><summary style="cursor:pointer;font-weight:600">GenAI 配置（可粘贴 OpenCode）</summary><div class="field"><label>OpenAI 兼容 Base URL</label><input id="apiBase" placeholder="https://.../v1"></div><div class="field"><label>模型</label><input id="apiModel" placeholder="deepseek-chat"></div><div class="field"><label>API Key（仅保存在本页会话）</label><input id="apiKey" type="password" placeholder="sk-..."></div><button class="btn" id="saveApi" style="width:100%">保存到当前会话</button><p style="color:var(--muted);font-size:11px">直连会让浏览器携带 Key，请只在自己的电脑使用；也可继续使用本地代理。</p></details><p style="color:var(--muted);font-size:12px;margin-top:14px">题面来自现有教材题库；解析由 GenAI 按当前题面生成。</p></aside><main class="main"><div class="toolbar"><span class="count" id="count"></span><span class="badge" id="topicBadge">全部知识点</span></div><div class="progress"><i id="bar"></i></div><section class="card" id="card"><div class="empty">正在加载题库…</div></section><div class="actions" style="justify-content:space-between"><button class="btn" id="prev">← 上一题</button><button class="btn" id="next">下一题 →</button></div></main></div></div>
<script src="教材题库数据.js"></script><script src="推荐数据.js"></script><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const OCR_FIX={"BK04-习题-3-19":"3-19. 一质量为 m、初速为 u 的粒子，碰到一个静止的、质量为 m₂ 的粒子，碰撞是完全弹性的。现观察到碰撞后两粒子具有等值反向的速度。求：(1) 比值 m₂/m；(2) 质心的速度；(3) 两粒子在质心系中的总动能，用 ½mu² 的分数来表示；(4) 在实验室参考系中 m₂ 的最终动能。"};const qs=TEXTBOOK_DATA.questions, rel=RELEVANCE_DATA.questions; let exam='651',type='',topic='',items=[],pos=0;
function analyses(){return new Map(rel.map(x=>[x.id,x]))} const am=analyses();
function rebuild(){exam=$("exam").value;type=$("type").value; const topics=[...new Set(rel.flatMap(a=>a.exams?.[exam]?.evidence?.map(e=>e.topic)||[]))].sort();$("tree").innerHTML='<button data-topic="">全部知识点</button>'+topics.map(t=>`<button data-topic="${esc(t)}">${esc(t)}</button>`).join('');$("type").innerHTML='<option value="">全部题型</option>'+[...new Set(qs.map(q=>q.type))].sort().map(t=>`<option>${esc(t)}</option>`).join('');if(type)$("type").value=type;items=qs.filter(q=>{const a=am.get(q.id),e=a?.exams?.[exam];return e&&(!type||q.type===type)&&(!topic||e.evidence.some(x=>x.topic===topic))&&!a.dependency_warning}).sort((a,b)=>(am.get(b.id)?.exams?.[exam]?.evidence?.length||0)-(am.get(a.id)?.exams?.[exam]?.evidence?.length||0));if(!items.length&&!type&&!topic){items=qs.filter(q=>OCR_FIX[q.id]||q.question_ocr||q.writing?.statement).slice(0,200)}pos=0;render()}
function grade(q){var o=document.getElementById("feedback"),t=document.getElementById("answerText").value;if(!t){o.textContent="请先输入答案";return}o.textContent="正在批阅…";var c=JSON.parse(sessionStorage.getItem("genai_config")||"{}"),u=c.base&&c.key?c.base+"/chat/completions":"http://127.0.0.1:8787/api/explain";fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:"请批阅这道物理题："+(q.question_ocr||"")+" 学生答案："+t})}).then(r=>r.json()).then(d=>o.textContent=d.answer||d.error||"无结果")}function render(){const q=items[pos];$("count").textContent=items.length?`${pos+1} / ${items.length}`:'暂无符合条件的题目';$("topicBadge").textContent=topic||'全部知识点';$("bar").style.width=items.length?`${(pos+1)/items.length*100}%`:'0%';$("prev").disabled=pos===0;$("next").disabled=!items.length||pos===items.length-1;if(!q){$("card").innerHTML='<div class="empty">没有符合当前筛选条件的题目，请调整知识树或题型。</div>';return}const a=am.get(q.id),e=a.exams[exam],topics=e.evidence.map(x=>x.topic);$("card").innerHTML=`<div class="meta"><span>${esc(q.type)}</span><span>${esc(q.book)}</span><span>${esc(q.original_number||q.id)}</span><span>${esc(e.tier)}</span></div><div class="question">${esc(OCR_FIX[q.id]||q.question_ocr||q.writing?.statement||'题面暂缺，请查看原页')}<div class="answerbox"><textarea id="answerText" placeholder="输入答案（支持 LaTeX）"></textarea><button class="btn primary" id="grade" onclick="grade(q)">提交答案并批阅</button><div id="feedback"></div></div></div><div class="source">知识点：${topics.map(esc).join(' · ')}<br>来源页：PDF ${q.regions?.[0]?.pdf_page||'—'} · ${esc(q.status||'题面待核验')}</div><div class="actions"><button class="btn primary" id="ask">✨ AI 讲解这道题</button><button class="btn" id="open">查看题目原图</button></div><div class="explain" id="explain"><h3>AI 讲解</h3><div id="answer">正在请求 GenAI…</div></div>`;$("open").onclick=()=>{const z=q.regions?.[0];if(z?.full_page)window.open(z.full_page,'_blank')};$("ask").onclick=()=>explain(q)}
async function explain(q){const box=$("explain"),out=$("answer");box.style.display='block';out.textContent='正在请求 GenAI…';const prompt=`你是考研物理老师。请用中文讲解这道题，严格按“思路、关键公式/概念、分步推导、易错点”输出。题目：${OCR_FIX[q.id]||q.question_ocr||q.writing?.statement}`;const cfg=JSON.parse(sessionStorage.getItem('genai_config')||'{}');const endpoint=cfg.base&&cfg.key?cfg.base.replace(/\/$/,'')+'/chat/completions':(localStorage.getItem('genai_endpoint')||'http://127.0.0.1:8787/api/explain');const headers={'Content-Type':'application/json'};if(cfg.key)headers.Authorization='Bearer '+cfg.key;const payload=cfg.key?{model:cfg.model||'deepseek-chat',messages:[{role:'user',content:prompt}],temperature:.2,max_tokens:2500}:{prompt,question:OCR_FIX[q.id]||q.question_ocr||q.writing?.statement};try{const r=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify(payload)});if(!r.ok)throw Error();const d=await r.json();out.textContent=d.answer||d.output||d.choices?.[0]?.message?.content||'接口未返回解析。'}catch(e){out.innerHTML='未连接到 GenAI。请在左侧粘贴 OpenCode 的 Base URL、模型和 Key，或启动本地代理。';}}
$("exam").onchange=()=>{topic='';rebuild()};$("type").onchange=()=>{type=$("type").value;rebuild()};$("tree").onclick=e=>{if(!e.target.dataset.topic&&e.target.tagName!=='BUTTON')return;topic=e.target.dataset.topic||'';rebuild()};$("recommend").onclick=()=>{items.sort(()=>Math.random()-.5);pos=0;render()};$("prev").onclick=()=>{if(pos>0){pos--;render()}};$("next").onclick=()=>{if(pos<items.length-1){pos++;render()}};rebuild();
</script></body>

<script>const ac=JSON.parse(sessionStorage.getItem("genai_config")||"{}");for(const k of ["base","model","key"]){const el=$("api"+k[0].toUpperCase()+k.slice(1));if(el)el.value=ac[k]||""}$("saveApi").onclick=()=>{sessionStorage.setItem("genai_config",JSON.stringify({base:$("apiBase").value.trim(),model:$("apiModel").value.trim(),key:$("apiKey").value.trim()}));alert("已保存到当前会话");}</script>
