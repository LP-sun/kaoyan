<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物理考研题库</title><style>body{font:17px/1.8 system-ui;margin:0;background:#f3f5f8;color:#172638}main{max-width:980px;margin:30px auto;padding:20px}h1{margin-bottom:0}button,select,input{font:inherit;margin:5px;padding:8px;border:1px solid #b9c4d0;border-radius:8px}article{background:white;padding:24px;margin:18px 0;border-radius:14px}small{color:#536477}summary{cursor:pointer;color:#1e5d97}img{max-width:100%}.bar{position:sticky;top:0;background:#f3f5f8;padding:8px}textarea{width:95%;height:80px;font:inherit}label{white-space:nowrap}</style><main><h1>普通物理 · 量子力学题库</h1><p><a href="教材习题题库.html">进入教材全书思考题与习题题库</a></p><p>闭卷回忆 → 教材补课 → 最小验证 → 错因记录 → 延迟复测</p><p>基础题为原创入门练习；真题仅索引原卷，默认冻结。学习记录保存在当前浏览器，可导出备份。</p><div class="bar"><select id="subject"><option value="">全部科目</option></select><input id="search" placeholder="搜索知识点 / 题目"><select id="mode"><option value="all">全部基础题</option><option value="wrong">错题</option><option value="due">到期复测</option></select><button id="random">随机10题</button><button id="export">导出记录</button><button id="reset">显示全部</button></div><p id="stats"></p><section id="list"></section><details><summary>真题索引（默认保留卷）</summary><p>本地仅3份卷，暂全部保留。展开原卷会暴露真题；确认模拟卷安排后再练。</p><label><input type="checkbox" id="unlock">我现在要查看原卷索引</label><section id="true"></section></details><p><a href="../README.md">资料说明</a> · <a href="基础题库与解析.md">完整解析</a> · <a href="课程习题索引.md">91条课程习题索引</a></p></main><script>const BANK=[{"id": "PHY-B001", "subject": "力学", "topic": "质点运动学", "type": "计算", "question": "质点 r(t)=(2t²,3t) m，求 t=1 s 的速度、加速度及曲率半径。", "answer": "v=(4,3) m/s，a=(4,0) m/s²。速率5，ρ=|v|³/|v×a|=125/12 m。", "pitfall": "曲率使用法向加速度，不能直接用总加速度。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B002", "subject": "力学", "topic": "牛顿定律与功能", "type": "计算", "question": "质量2 kg的物体在光滑水平面由静止出发，沿x方向受力F=3x N；运动到x=2 m时速度多大？", "answer": "功∫₀²3x dx=6 J，mv²/2=6，v=√6 m/s。", "pitfall": "变力功须积分。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B003", "subject": "力学", "topic": "动量与碰撞", "type": "计算", "question": "质量m的小球以v撞上静止的质量2m小球，完全非弹性碰撞，无外冲量。求共同速度及损失动能。", "answer": "共同速度v/3；初动能mv²/2，末动能mv²/6，损失mv²/3。", "pitfall": "动量守恒不等于动能守恒。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B004", "subject": "力学", "topic": "刚体转动", "type": "计算", "question": "均匀实心球从高度h沿斜面无滑动滚下，I=2mR²/5，求质心速率。", "answer": "mgh=mv²/2+I(v/R)²/2=7mv²/10，v=√(10gh/7)。", "pitfall": "无滑动约束v=ωR。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B005", "subject": "力学", "topic": "振动与波", "type": "计算", "question": "两列波y₁=Acos(kx−ωt)、y₂=Acos(kx+ωt)叠加，写合成波及波节位置。", "answer": "y=2Acos(kx)cos(ωt)；波节kx=(n+1/2)π；相邻波节间距λ/2。", "pitfall": "驻波振幅随位置变。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B006", "subject": "力学", "topic": "狭义相对论", "type": "计算", "question": "两飞船在地面系分别以+0.8c、−0.8c运动，一船测另一船速率多少？", "answer": "速度变换u′=(u−v)/(1−uv/c²)，大小1.6c/1.64=40c/41。", "pitfall": "不能直接相加得到1.6c。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B007", "subject": "热学", "topic": "气体分子运动论", "type": "简答", "question": "理想气体分子的最概然、平均和方均根速率分别是什么？", "answer": "v_mp=√(2kT/m)，平均速率√(8kT/(πm))，v_rms=√(3kT/m)；v_mp<平均速率<v_rms。", "pitfall": "比较速率而非速度矢量平均值。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B008", "subject": "热学", "topic": "热力学与熵", "type": "计算", "question": "1 mol单原子理想气体从T₀可逆等容升温到2T₀，求W、Q、ΔS。约定气体对外做功为正。", "answer": "W=0，Q=ΔU=3RT₀/2；ΔS=∫C_V dT/T=3Rln2/2。", "pitfall": "熵变须通过可逆路径计算。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B009", "subject": "热学", "topic": "热力学与熵", "type": "计算", "question": "卡诺热机工作于600 K和300 K之间，每周期吸热200 J。求效率、功、排热。", "answer": "η=1−300/600=1/2；W=100 J，Q_c=100 J。", "pitfall": "温度必须使用K。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B010", "subject": "电磁学", "topic": "静电场", "type": "计算", "question": "真空同心球电容器内外半径a、b，b>a。推导电容。", "answer": "E=Q/(4πε₀r²)，V=Q(1/a−1/b)/(4πε₀)，C=4πε₀ab/(b−a)。", "pitfall": "积分方向与电势差保持一致。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B011", "subject": "电磁学", "topic": "稳恒磁场", "type": "计算", "question": "无限长直导线电流I，求距导线r处磁场及方向。", "answer": "安培环路B·2πr=μ₀I，B=μ₀I/(2πr)；方向按右手定则。", "pitfall": "应用环路定理须有对称性。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B012", "subject": "电磁学", "topic": "电磁感应", "type": "计算", "question": "N匝面积S线圈在匀强磁场B中转动，法线与B夹角ωt，求感应电动势。", "answer": "Φ=NBS cos(ωt)，按所选正向ε=−dΦ/dt=NBSωsin(ωt)。", "pitfall": "先约定面积正向再判断符号。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B013", "subject": "电磁学", "topic": "交直流电路", "type": "计算", "question": "电源ε经R给初始无电荷的C充电，求q(t)及电流。", "answer": "R dq/dt+q/C=ε；q=Cε(1−e^(−t/RC))；i=εe^(−t/RC)/R。", "pitfall": "充电初期电流最大。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B014", "subject": "电磁学", "topic": "麦克斯韦方程与电磁波", "type": "简答", "question": "圆形平行板电容器半径R，充电电流I，忽略边缘效应，求板间距轴r<R处的B。", "answer": "位移电流穿过半径r圆面为I r²/R²；B·2πr=μ₀I r²/R²；B=μ₀Ir/(2πR²)，方向沿环向。", "pitfall": "位移电流随所选面积变化。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B015", "subject": "电磁学", "topic": "国际单位制", "type": "填空", "question": "写出电容、电感、磁通量、磁感应强度的SI单位，并给出关系。", "answer": "F，H，Wb，T；1 Wb=1 V·s，1 T=1 Wb/m²，1 H=1 Wb/A，1 F=1 C/V。", "pitfall": "磁通量与磁感应强度单位不同。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B016", "subject": "光学", "topic": "光波与偏振态", "type": "简答", "question": "E_x=E₀cos(kz−ωt)，E_y=E₀cos(kz−ωt+π/2)，判断偏振态。", "answer": "相互垂直的等幅分量相差π/2，合成圆偏振光；旋向需说明观察方向和相位约定。", "pitfall": "旋向不能脱离观察方向判断。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B017", "subject": "光学", "topic": "光的干涉", "type": "计算", "question": "杨氏双缝间距0.50 mm，屏距2.0 m，波长500 nm，求条纹间距。", "answer": "Δx=λD/d=2.0 mm，采用远场小角近似。", "pitfall": "单位须转换成米。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B018", "subject": "光学", "topic": "光的干涉", "type": "计算", "question": "迈克尔孙干涉仪中反射镜移动0.15 mm，数到500条条纹，求波长。", "answer": "2Δd=Nλ，λ=600 nm。", "pitfall": "光程差变化是镜移的2倍。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B019", "subject": "光学", "topic": "光的衍射与仪器", "type": "计算", "question": "单缝宽0.20 mm，波长500 nm，焦距0.40 m。求焦平面中央主极大宽度。", "answer": "第一暗纹a sinθ=λ；小角下中央宽度2fλ/a=2.0 mm。", "pitfall": "中央宽度是从两侧第一暗纹之间算。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B020", "subject": "光学", "topic": "光的衍射与仪器", "type": "计算", "question": "光栅有5000条被照亮刻线，二级光谱中λ=600 nm，最小可分辨波长差？", "answer": "分辨本领R=mN=10000；Δλ=λ/R=0.060 nm。", "pitfall": "N是照亮刻线总数。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B021", "subject": "光学", "topic": "偏振与双折射", "type": "计算", "question": "非偏振光强I₀依次通过三个理想偏振片，透振方向0°、45°、90°，求出射光强。", "answer": "I₁=I₀/2，I₂=I₀/4，I₃=I₀/8。", "pitfall": "非偏振光通过第一片先减半。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B022", "subject": "光学", "topic": "偏振与双折射", "type": "简答", "question": "等幅正交分量组成线偏振光，沿四分之一波片两主轴入射时如何得到圆偏振？", "answer": "入射线偏振与主轴成45°，产生等幅分量；波片引入π/2相位差，输出圆偏振。", "pitfall": "其他夹角通常输出椭圆偏振。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B023", "subject": "原子物理", "topic": "原子量子态与精细结构", "type": "计算", "question": "类氢离子核电荷Z=2，电子n=3跃迁到n=2，忽略精细结构和约化质量修正，求光子能量。", "answer": "E_n=−13.6Z²/n² eV；ΔE=54.4(1/4−1/9)=7.56 eV。", "pitfall": "能级为负，光子能量为正差值。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B024", "subject": "原子物理", "topic": "原子量子态与精细结构", "type": "简答", "question": "单电子电偶极跃迁中轨道角动量和磁量子数的选择规则是什么？", "answer": "Δl=±1，Δm=0,±1，宇称改变；含自旋耦合时还需检查Δj=0,±1且j=0到0禁戒。", "pitfall": "不能只检查能量下降。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B025", "subject": "原子物理", "topic": "多电子原子", "type": "简答", "question": "两个非同科p电子在LS耦合下可有哪些L和S？同科时能直接使用所有组合吗？", "answer": "l₁=l₂=1给L=0,1,2；s₁=s₂=1/2给S=0,1。非同科可组合这些值；同科受泡利反对称性限制，须筛选。", "pitfall": "同科电子不能当可区分粒子。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B026", "subject": "原子物理", "topic": "磁场中的原子", "type": "计算", "question": "LS耦合态l=1、s=1/2、j=3/2的Landé因子是多少？弱场能移如何写？", "answer": "g_J=1+[j(j+1)+s(s+1)−l(l+1)]/[2j(j+1)]=4/3；ΔE=g_Jμ_B m_J B。", "pitfall": "公式适用于弱场LS耦合。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B027", "subject": "原子物理", "topic": "X射线", "type": "计算", "question": "康普顿散射角90°时波长增加多少？", "answer": "Δλ=h(1−cosθ)/(m_ec)=h/(m_ec)≈2.426 pm，适用于初始近似静止自由电子。", "pitfall": "波长差与入射波长无关。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B028", "subject": "原子物理", "topic": "分子光谱", "type": "简答", "question": "刚性双原子转子的转动能级与电偶极转动跃迁规则是什么？", "answer": "E_J=ℏ²J(J+1)/(2I)，J=0,1,…；有永久电偶极矩的分子满足ΔJ=±1。", "pitfall": "同核双原子分子没有此类纯转动电偶极谱。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B029", "subject": "原子物理", "topic": "原子核", "type": "计算", "question": "核反应质量亏损0.010 u对应多少释放能量？", "answer": "Q=Δmc²≈0.010×931.5 MeV=9.315 MeV；前后质量必须使用一致的原子或核质量口径。", "pitfall": "不能混用电子计数不一致的质量。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B030", "subject": "原子物理", "topic": "量子物理基础", "type": "计算", "question": "非相对论电子经100 V加速，求德布罗意波长。", "answer": "p=√(2m_e eV)，λ=h/p≈0.123 nm。", "pitfall": "先验证eV远小于m_ec²。", "source": "按本地大纲原创基础练习；非真题、非教材原题", "difficulty": "基础至中等", "reserved": false}, {"id": "PHY-B031", "subject": "量子力学", "topic": "早
